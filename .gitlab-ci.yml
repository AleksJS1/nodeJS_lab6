stages:
  - build
  - test
  - deploy

default:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

build:
  stage: build
  before_script:
    - npm ci --prefer-offline --no-audit
  script:
    - npm run build

test:
  stage: test
  before_script:
    - npm ci --prefer-offline --no-audit
  script:
    - npm run test:coverage -- --ci

deploy:
  stage: deploy
  image: flyio/flyctl:latest
  script:
    - fly deploy --remote-only --config fly.toml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never