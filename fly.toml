# fly.toml app configuration file generated for nodejs-lab6-hdwoyg on 2026-05-10T14:24:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nodejs-lab6-hdwoyg'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'bluegreen'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
